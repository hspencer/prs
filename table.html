<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Minimal, self-contained HTML + CSS for a 3×3 table of icons and titles -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Design Manifesto – 3×3 Principles Grid</title>
  <style>
    /* Layout */
    body { margin: 0; padding: 24px; background: #fff; color: #111; font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif; }
    .wrap { max-width: 1040px; margin: 0 auto; }
    table.manifest-grid { width: 100%; border-collapse: collapse; table-layout: fixed; }
    table.manifest-grid td { border: 1px solid #e5e5e5; padding: 20px; vertical-align: middle; text-align: center; }
    figure.cell { margin: 0; }
    figure.cell svg { display: block; margin: 0 auto 10px; width: 72px; height: 72px; color: #111; } /* stroke uses currentColor */
    figure.cell figcaption { font-weight: 600; font-size: 14px; line-height: 1.25; letter-spacing: .2px; }
    /* Optional: subtle hover focus for visual feedback */
    td:focus-within, td:hover { background: #fafafa; }
    /* Respect user prefers-reduced-motion: nothing animated here */
  </style>
</head>
<body>
  <div class="wrap">
    <table class="manifest-grid" aria-label="Design Manifesto Principles (3 by 3)">
      <tbody>
        <tr>
          <td>
            <figure class="cell">
              <!-- Icon 1: Semantically clear / cognitively accessible -->
              <svg viewBox="0 0 64 64" role="img" aria-labelledby="t1" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title id="t1">Semantically clear</title>
                <!-- frame (optional visual boundary) -->
                <rect x="6" y="6" width="52" height="52" rx="6"/>
                <!-- conceptual segmentation: circle, square, triangle -->
                <circle cx="18" cy="26" r="6"/>
                <rect x="28" y="20" width="12" height="12" rx="2"/>
                <polygon points="50,30 56,38 44,38"/>
              </svg>
              <figcaption>1. Semantically clear</figcaption>
            </figure>
          </td>
          <td>
            <figure class="cell">
              <!-- Icon 2: Culturally situated (place, sun/land) -->
              <svg viewBox="0 0 64 64" role="img" aria-labelledby="t2" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title id="t2">Culturally situated</title>
                <!-- sun -->
                <circle cx="50" cy="16" r="6"/>
                <!-- landforms -->
                <path d="M10 44 C 22 36, 42 52, 54 44"/>
                <path d="M10 52 C 20 48, 28 48, 36 50"/>
                <!-- small sprout to suggest living local knowledge -->
                <path d="M20 44 q2 -6 6 -6"/>
                <path d="M26 38 q-4 2 -6 6"/>
              </svg>
              <figcaption>2. Culturally situated</figcaption>
            </figure>
          </td>
          <td>
            <figure class="cell">
              <!-- Icon 3: Pragmatically grounded (desire path) -->
              <svg viewBox="0 0 64 64" role="img" aria-labelledby="t3" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title id="t3">Pragmatically grounded</title>
                <!-- anchors -->
                <circle cx="12" cy="50" r="3"/>
                <circle cx="52" cy="14" r="3"/>
                <!-- worn path (what works) -->
                <path d="M12 50 C 22 38, 28 30, 34 28 S 46 22, 52 14"/>
              </svg>
              <figcaption>3. Pragmatically grounded</figcaption>
            </figure>
          </td>
        </tr>
        <tr>
          <td>
            <figure class="cell">
              <!-- Icon 4: Promote autonomy (open lock) -->
              <svg viewBox="0 0 64 64" role="img" aria-labelledby="t4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title id="t4">Promote autonomy</title>
                <!-- lock body -->
                <rect x="16" y="28" width="32" height="24" rx="4"/>
                <!-- open shackle -->
                <path d="M24 28 v-8 a8 8 0 0 1 16 0"/>
                <!-- keyhole (simple) -->
                <circle cx="32" cy="40" r="2"/>
                <path d="M32 42 v4"/>
              </svg>
              <figcaption>4. Promote autonomy</figcaption>
            </figure>
          </td>
          <td>
            <figure class="cell">
              <!-- Icon 5: Convivial (distributed network, no centre dominance) -->
              <svg viewBox="0 0 64 64" role="img" aria-labelledby="t5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title id="t5">Convivial</title>
                <!-- hex ring -->
                <polygon points="32,12 46,20 46,44 32,52 18,44 18,20"/>
                <!-- nodes -->
                <circle cx="32" cy="12" r="3"/><circle cx="46" cy="20" r="3"/>
                <circle cx="46" cy="44" r="3"/><circle cx="32" cy="52" r="3"/>
                <circle cx="18" cy="44" r="3"/><circle cx="18" cy="20" r="3"/>
                <!-- light cross-links -->
                <line x1="18" y1="20" x2="46" y2="44"/>
                <line x1="46" y1="20" x2="18" y2="44"/>
              </svg>
              <figcaption>5. Convivial</figcaption>
            </figure>
          </td>
          <td>
            <figure class="cell">
              <!-- Icon 6: Transparent processes (wireframe cube) -->
              <svg viewBox="0 0 64 64" role="img" aria-labelledby="t6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title id="t6">Transparent processes</title>
                <!-- front square -->
                <rect x="14" y="22" width="26" height="26"/>
                <!-- back square -->
                <rect x="24" y="14" width="26" height="26"/>
                <!-- connectors -->
                <line x1="14" y1="22" x2="24" y2="14"/>
                <line x1="40" y1="22" x2="50" y2="14"/>
                <line x1="14" y1="48" x2="24" y2="40"/>
                <line x1="40" y1="48" x2="50" y2="40"/>
              </svg>
              <figcaption>6. Transparent processes</figcaption>
            </figure>
          </td>
        </tr>
        <tr>
          <td>
            <figure class="cell">
              <!-- Icon 7: Open & shareable (open box/flaps) -->
              <svg viewBox="0 0 64 64" role="img" aria-labelledby="t7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title id="t7">Open &amp; shareable</title>
                <!-- base box -->
                <rect x="14" y="28" width="36" height="22"/>
                <!-- flaps -->
                <path d="M14 28 L24 18 L32 28 Z"/>
                <path d="M50 28 L40 18 L32 28 Z"/>
                <!-- share arrows (bidirectional) -->
                <path d="M22 54 h20"/>
                <path d="M42 54 l-3 -3"/><path d="M42 54 l-3 3"/>
                <path d="M22 54 l3 -3"/><path d="M22 54 l3 3"/>
              </svg>
              <figcaption>7. Open &amp; shareable</figcaption>
            </figure>
          </td>
          <td>
            <figure class="cell">
              <!-- Icon 8: Hospitable (meeting table) -->
              <svg viewBox="0 0 64 64" role="img" aria-labelledby="t8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title id="t8">Hospitable</title>
                <!-- table top -->
                <rect x="12" y="24" width="40" height="6" rx="2"/>
                <!-- legs -->
                <line x1="18" y1="30" x2="18" y2="48"/>
                <line x1="46" y1="30" x2="46" y2="48"/>
                <!-- seats (shared positions) -->
                <line x1="24" y1="24" x2="24" y2="30"/>
                <line x1="32" y1="24" x2="32" y2="30"/>
                <line x1="40" y1="24" x2="40" y2="30"/>
              </svg>
              <figcaption>8. Hospitable</figcaption>
            </figure>
          </td>
          <td>
            <figure class="cell">
              <!-- Icon 9: Open (door ajar / revisable) -->
              <svg viewBox="0 0 64 64" role="img" aria-labelledby="t9" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <title id="t9">Open</title>
                <!-- frame -->
                <rect x="12" y="12" width="40" height="40" rx="2"/>
                <!-- door panel ajar -->
                <rect x="30" y="14" width="16" height="36"/>
                <!-- opening gap -->
                <line x1="28" y1="14" x2="28" y2="50"/>
                <!-- handle -->
                <circle cx="42" cy="32" r="1.8"/>
              </svg>
              <figcaption>9. Open</figcaption>
            </figure>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</body>
</html>
