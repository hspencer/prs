<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500">
  <defs>
    <!-- El filtro opera en unidades del viewBox (px del SVG), no fracciones. -->
    <filter id="blur" filterUnits="userSpaceOnUse"
            x="-200" y="-200" width="900" height="900">
      <!-- Cambia este valor y guarda el archivo para ver más/menos feather -->
      <feGaussianBlur stdDeviation="18"/>
    </filter>

    <!-- La máscara también trabaja en coordenadas del viewBox (px) -->
    <mask id="soft" maskUnits="userSpaceOnUse" maskContentUnits="userSpaceOnUse">
      <!-- Fondo negro = 100% transparente -->
      <rect x="0" y="0" width="500" height="500" fill="black"/>
      <!-- Círculo blanco con blur = borde difuso -->
      <circle cx="250" cy="250" r="215" fill="white" filter="url(#blur)"/>
    </mask>
  </defs>

  <!-- (Opcional de prueba) -->
  <rect width="500" height="500" fill="white" mask="url(#soft)"/>
</svg>